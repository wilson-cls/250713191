<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>Switch-Case: Pilihan Transportasi</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <script type="text/javascript">
        var sInput;
        sInput = prompt("Pilih Transportasi: (K)ereta, (B)us, (P)esawat, (M)otor", "K");

        switch(sInput){
            case "K":
                alert("Naik Kereta: Berangkat Dari Statusin");
                break;
            case "B":
                alert("Naik Bus: Berangkat Dari Terminal");
                break;
            case "P":
                alert("Naik Pesawat: Berangkat Dari Bandara");
                break;
            case "M":
                alert("Naik Motor: Berangkat Dari Rumah");
                break;
            default:
                alert("Transportasi Tidak Tersedia");
        }
    </script>
</head>

<body>
    <h1>Switch-Case: Pilihan Transportasi</h1>
    <p>Reload Halaman Untuk Mencoba Lagi.</p>
</body>

</html>
