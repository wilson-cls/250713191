<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Kegiatan</title>
</head>
<body>
    <h1>Formulir Pendaftaran Kegiatan</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <h2>Data Pendaftar</h2>
        <table cellspacing = "4" cellpadding = "4" border = "1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td style="width: 32%;">
                   <label for="nama"><strong>Nama</strong></label>
                </td>

                <td >
                    <input type="text" name="nama" id="nama" />
                </td>
            </tr>

            <tr>
                <td style="width: 32%;">
                    <label for="NIM"><strong>NIM</strong></label>
                </td>

                <td>
                    <input type="text" name="NIM" id="NIM" />
                </td>
            </tr>

            <tr>
                <td style="width: 32%;">
                    <label for="program studi"><strong>Program Studi</strong></label>
                </td>
                
                <td>
                    <select name="programStudi" id="programStudi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td style="width: 32%;">
                    <label for="jenisKelamin"><strong>Jenis Kelamin</strong></label>
                </td>

                <td>
                    <input type="radio" name="jenisKelamin" id="lakiLaki" />
                    <label for="lakiLaki">Laki Laki</label>

                    <input type="radio" name="jenisKelamin" id="perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
        </table>

        <h2>Pilihan Kegiatan</h2>
        <table cellspacing = "4" cellpadding = "4" border = "1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td style="width: 32%;">
                    <label for="jenisKegiatan"><strong>Jenis Kegiatan</strong></label>
                </td>

                <td>
                    <input type="radio" name="kegiatan" id="seminar" />
                    <label for="seminar">Seminar</label>

                    <input type="radio" name="kegiatan" id="pelatihan" />
                    <label for="pelatihan">Pelatihan</label>

                    <input type="radio" name="kegiatan" id="diskusi" />
                    <label for="diskusi">Diskusi</label>
                </td>
            </tr>

            <tr>
                <td style="width: 32%;">
                    <label for="bidang"><strong>Bidang Minat</strong></label>
                </td>

                <td>
                    <p>
                        <input type="checkbox" name="bidang" id="teknologi" />
                        <label for="teknologi">Teknologi</label>
                    </p>

                    <p>
                        <input type="checkbox" name="bidang" id="organisasi" />
                        <label for="organisasi">Organisasi</label>
                    </p>

                    <p>
                        <input type="checkbox" name="bidang" id="karier" />
                        <label for="karier">Karier</label>
                    </p>
                </td>
            </tr>

            <tr>
                <td style="width: 32%;">
                    <label for="waktu"><strong>Waktu Kegiatan</strong></label>
                </td>

                <td>
                    <select name="waktu" id="waktuKegiatan">
                        <option>Pagi</option>
                        <option>Siang</option>
                        <option>Sore</option>
                    </select>
                </td>
            </tr>
        </table>

        <h2>Kelengkapan Pendaftaran</h2>
        <table cellspacing = "4" cellpadding = "4" border = "1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td style="width: 32%;">
                    <label for="harapan"><strong>Harapan Mengikuti Kegiatan</strong></label>
                </td>

                <td>
                    <textarea name="harapan" id="harapan" rows="7" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td style="width: 32%;">
                    <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                </td>

                <td>
                    <input type="file" name="buktiPembayaran" id="buktiPembayaran" accept="application/pdf, image/jpeg, image/png"/>
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" name="kirim" id="kirim" value="Kirim" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
