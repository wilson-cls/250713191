<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Tim Lomba</title>
    <link rel="stylesheet" href="style.css" />
    
</head>

<body>
    <div id="border">
        <h1>Formulir Pendaftaran Tim Lomba</h1>
        <p>Isilah seluruh data kelompok dan kumpulkan karya di bawah ini</p>

        <form action="" method="post" enctype="multipart/form-data">
            <table cellspacing = "6" cellpadding = "8" style="border-collapse: collapse; width: 100%; border: 1px solid black;">
                <tr>
                    <td>
                        <label for="namaTim"><strong>Nama Tim / Kelompok</strong></label>
                    </td>

                    <td>
                        <input type="text" name="namaTim" id="namaTim" size="30" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="ketua"><strong>Nama Ketua Tim</strong></label>
                    </td>

                    <td>
                        <input type="text" name="ketua" id="ketua" size="30" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="jumlah"><strong>Jumlah Anggota Tim</strong></label>
                    </td>

                    <td>
                        <select name="jumlah" id="jumlah">
                            <option value="" selected = "selected">Pilih Jumlah Tim, Maksimal 5 Orang</option>
                            <option>1 Orang</option>
                            <option>2 Orang</option>
                            <option>3 Orang</option>
                            <option>4 Orang</option>
                            <option>5 Orang</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="telepon"><strong>Kontak / WhatsApp Ketua</strong></label>
                    </td>

                    <td>
                        <input type="text" id="telepon" name="telepon" size="30" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="Universitas">
                            <strong>Asal Universitas / Instansi</strong>
                        </label>
                    </td>

                    <td>
                        <input type="text" name="Universitas" id="Universitas" size="30" />
                    </td>
                </tr>

                <tr>
                    <td style="vertical-align: top;">
                        <strong>Kategori Lomba</strong>
                    </td>

                    <td>
                        <input type="checkbox" name="bidang" id="coding" value="Coding" />
                        <label for="coding">Coding</label>
                        <input type="checkbox" name="bidang" id="desain" value="Desain" />
                        <label for="desain">Desain</label>
                        <input type="checkbox" name="bidang" id="video" value="Video" />
                        <label for="video">Video</label>
                        <input type="checkbox" name="bidang" id="essay" value="Essay" />
                        <label for="essay">Essay</label>
                    </td>
                </tr>
                
                <tr>
                    <td>
                        <strong>Status Peserta</strong>
                    </td>

                    <td>
                        <input type="radio" name="peserta" id="mahasiswa" value="Mahasiswa" />
                        <label for="mahasiswa">Mahasiswa Aktif</label>
                        <input type="radio" name="peserta" id="umum" value="Umum" />
                        <label for="umum">Bukan Mahasiswa Aktif</label>
                    </td>
                </tr>

                <tr>
                    <td style="vertical-align: top;">
                        <label for="deskripsi">
                            <strong>Ringkasan Penjelasan Karya</strong>
                        </label>
                    </td>

                    <td>
                        <textarea name="deskripsi" id="deskripsi" rows="10" cols="100"></textarea>
                    </td>
                </tr>

                <tr>
                    <td style="vertical-align: top;">
                        <label for="alasan">
                            <strong>Motivasi Mengikuti Kompetisi Ini</strong>
                        </label>
                    </td>

                    <td>
                        <textarea name="alasan" id="alasan" rows="7" cols="100"></textarea>
                    </td>
                </tr>

                <tr id="kirim-file">
                    <td>
                        <label for="filekarya">
                            <strong>Unggah File Karya</strong>
                        </label>
                    </td>

                    <td>
                        <input type="file" name="filekarya" id="filekarya" accept="application/pdf, image/jpeg, image/png" />
                    </td>
                </tr>

                <tr id="sumbit">
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" name="daftar" value="Kirim Formulir Pendaftaran"/>
                    </td>
                </tr>
                
            </table>
        </form>
    </div>
</body>

</html>
